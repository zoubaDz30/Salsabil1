name: Build APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract zip file if exists
        run: |
          # البحث عن أي ملف zip وفك ضغطه في المجلد الحالي
          for f in *.zip; do
            if [ -f "$f" ]; then
              echo "Extracting $f..."
              unzip -o "$f"
            fi
          done
          # نقل الملفات إذا كانت داخل مجلد فرعي تم فك ضغطه
          if [ ! -f "gradlew" ]; then
            SUBDIR=$(find . -maxdepth 2 -name "gradlew" -exec dirname {} \;)
            if [ -n "$SUBDIR" ] && [ "$SUBDIR" != "." ]; then
              echo "Moving files from $SUBDIR to root..."
              cp -r $SUBDIR/* .
            fi
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew || true

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Alsalsabeel-APK
          path: app/build/outputs/apk/debug/*.apk
