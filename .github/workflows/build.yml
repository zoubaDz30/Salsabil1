name: Build APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unpack zip files and setup structure
        run: |
          sudo apt-get update && sudo apt-get install -y unzip
          mkdir -p extracted
          find . -maxdepth 2 -type f -iname "*.zip" -exec unzip -q -o {} -d ./extracted \;
          
          # نقل محتويات المشروع لمسار العمل الرئيسي
          if [ -d "./extracted" ]; then
            ROOT_DIR=$(find ./extracted -name "build.gradle.kts" -not -path "*/app/*" -exec dirname {} \; | head -n 1)
            if [ -n "$ROOT_DIR" ]; then
              cp -r "$ROOT_DIR"/* . 2>/dev/null || true
            else
              cp -r ./extracted/* . 2>/dev/null || true
            fi
          fi

          # إنشاء ملف .env المطلوب للمشروع
          touch .env
          echo "GEMINI_API_KEY=dummy_key_for_build" > .env

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Build Debug APK
        run: |
          chmod +x gradlew || true
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Alsalsabeel-App
          path: app/build/outputs/apk/debug/*.apk
