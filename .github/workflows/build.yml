name: Build APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unpack all zip archives
        run: |
          sudo apt-get update && sudo apt-get install -y unzip
          # فك ضغط أي ملف ينتهي بـ .zip مهما كان اسمه
          find . -maxdepth 2 -type f -iname "*.zip" -exec unzip -o {} -d ./extracted \;
          
          # نقل محتويات المجلد المفكوك إلى المجلد الرئيسي
          if [ -d "./extracted" ]; then
            cp -r ./extracted/* . 2>/dev/null || true
            # إذا كانت الملفات داخل مجلد إضافي
            find ./extracted -name "build.gradle*" -exec dirname {} \; | head -n 1 | while read dir; do
              cp -r "$dir"/* . 2>/dev/null || true
            done
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Debug APK
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug --no-daemon --stacktrace
          else
            gradle assembleDebug --no-daemon --stacktrace
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Alsalsabeel-APK
          path: app/build/outputs/apk/debug/*.apk
